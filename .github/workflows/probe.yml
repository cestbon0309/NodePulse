name: Probe
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - name: Cross-build static musl binaries
        run: probe/build.sh
      - name: Assemble stable release assets and SHA256 checksums
        run: |
          cp install.sh probe/dist/install.sh
          cd probe/dist
          for arch in x86_64 i386 aarch64 armv7 armv7-soft mips mipsel; do
            test -s "npulse-linux-$arch"
            test -s "npulse-linux-$arch-lite"
          done
          sha256sum npulse-linux-* install.sh > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Native Linux integration and real proc metrics
        env:
          NPULSE_ASSERT_LINUX: '1'
        run: |
          python probe/tools/test-probe.py probe/dist/npulse-linux-x86_64
          python probe/tools/test-lite.py probe/dist/npulse-linux-x86_64-lite
      - name: Install QEMU user emulation
        run: sudo apt-get update && sudo apt-get install -y qemu-user shellcheck busybox ninja-build libglib2.0-dev python3-venv
      - name: Build QEMU 11.1 MIPS with big-endian getifaddrs fix
        run: |
          curl -fsSL https://download.qemu.org/qemu-11.1.0.tar.xz -o "$RUNNER_TEMP/qemu.tar.xz"
          echo "6ee1d1a61f68212476b27108c26da5f449dc09b626d42f8279ba0dc2e08fa858  $RUNNER_TEMP/qemu.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/qemu-source" "$RUNNER_TEMP/qemu-build"
          tar -xf "$RUNNER_TEMP/qemu.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/qemu-source"
          cd "$RUNNER_TEMP/qemu-build"
          ../qemu-source/configure --target-list=mips-linux-user --disable-system --disable-docs --disable-tools --disable-guest-agent --disable-plugins
          ninja -j2 qemu-mips
          echo "$RUNNER_TEMP/qemu-build" >> "$GITHUB_PATH"
      - name: POSIX and BusyBox installer lifecycle
        run: |
          shellcheck -s sh install.sh
          python probe/tools/test-installer.py /bin/dash
          python probe/tools/test-installer.py busybox sh
          python probe/tools/test-pair-installer.py /bin/dash
      - name: QEMU encrypted get and real proc metrics
        run: |
          for pair in aarch64:aarch64 armv7:arm armv7-soft:arm mips:mips mipsel:mipsel; do
            arch=${pair%%:*}
            emulator=${pair#*:}
            python probe/tools/linux_metrics.py "qemu-${emulator}" "probe/dist/npulse-linux-${arch}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: npulse-linux
          path: |
            probe/dist/npulse-linux-*
            probe/dist/SHA256SUMS
            probe/dist/install.sh
          if-no-files-found: error
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Pick available iPhone simulator (iOS 17+)
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          choices = [(tuple(map(int, runtime.rsplit('iOS-', 1)[1].split('-'))), device['udid'])
                     for runtime, entries in devices.items() if 'iOS-' in runtime
                     for device in entries if device['name'].startswith('iPhone') and device['isAvailable']]
          version, udid = max(choice for choice in choices if choice[0][0] >= 17)
          print(f'Using iOS {version}: {udid}', flush=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'SIMULATOR_ID={udid}\n')
          PY
      - name: Generate project
        working-directory: ios
        run: xcodegen
      - name: Build and test (ad-hoc signed, real Keychain)
        working-directory: ios
        run: |
          xcodebuild test -scheme NodePulse \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -parallel-testing-enabled NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-ios-test-results
          path: ios/build/Logs/Test/*.xcresult
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, simulator]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/download-artifact@v4
        with:
          name: npulse-linux
          path: dist
      - name: Build unsigned arm64 device IPA
        env:
          TAG: ${{ github.ref_name }}
        run: bash ios/tools/build-unsigned-ipa.sh "$TAG"
      - name: Add IPA to verified release checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp "ios/build/NodePulse-$TAG.ipa" dist/
          cd dist
          shasum -a 256 "NodePulse-$TAG.ipa" >> SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Attach verified binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG"; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" dist/npulse-linux-* dist/SHA256SUMS dist/install.sh "dist/NodePulse-$TAG.ipa" --clobber
