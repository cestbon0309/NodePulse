name: NodePulse
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.18.0
targets:
  NodePulse:
    type: application
    platform: iOS
    sources: [NodePulse]
    info:
      path: NodePulse/Info.plist
      properties:
        NSCameraUsageDescription: 扫描探针终端的配对二维码，填写连接信息；仍需核对安全图案和数字。
        CFBundleURLTypes:
          - CFBundleURLName: com.cestbon.nodepulse.pair
            CFBundleURLSchemes: [nodepulse]
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cestbon.nodepulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接局域网中的监控探针，查看节点状态。
        INFOPLIST_KEY_NSFaceIDUsageDescription: 验证身份后管理探针、打开终端或执行电源操作。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  NodePulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NodePulseTests
      - path: ../probe/tools/e2e-vector.json
        buildPhase: resources
      - path: ../probe/tools/pair-vector.json
        buildPhase: resources
    dependencies:
      - target: NodePulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NodePulse:
    build:
      targets:
        NodePulse: all
    test:
      targets: [NodePulseTests]
      environmentVariables:
        NPULSE_E2E: "${NPULSE_E2E}"
        NPULSE_ADMIN_E2E: "${NPULSE_ADMIN_E2E}"
        NPULSE_PAIR_E2E: "${NPULSE_PAIR_E2E}"
