name: NodePulse
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  NodePulse:
    type: application
    platform: iOS
    sources: [NodePulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cestbon.nodepulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your monitoring probes.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  NodePulseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NodePulseTests]
    dependencies:
      - target: NodePulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NodePulse:
    build:
      targets:
        NodePulse: all
    test:
      targets: [NodePulseTests]
      environmentVariables:
        NPULSE_E2E: "${NPULSE_E2E}"
