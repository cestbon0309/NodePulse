name: NodePulse
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.18.0
targets:
  NodePulse:
    type: application
    platform: iOS
    sources: [NodePulse]
    info:
      path: NodePulse/Info.plist
      properties:
        NSCameraUsageDescription: Scan the probe terminal QR code to fill connection details. Always verify the security pattern and digits.
        CFBundleURLTypes:
          - CFBundleURLName: com.cestbon.nodepulse.pair
            CFBundleURLSchemes: [nodepulse]
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cestbon.nodepulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to monitoring probes on your local network to view node status.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Verify your identity before managing probes, opening terminals or using power controls.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  NodePulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NodePulseTests
      - path: ../probe/tools/e2e-vector.json
        buildPhase: resources
      - path: ../probe/tools/pair-vector.json
        buildPhase: resources
    dependencies:
      - target: NodePulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NodePulse:
    build:
      targets:
        NodePulse: all
    test:
      targets: [NodePulseTests]
      environmentVariables:
        NPULSE_E2E: "${NPULSE_E2E}"
        NPULSE_ADMIN_E2E: "${NPULSE_ADMIN_E2E}"
        NPULSE_PAIR_E2E: "${NPULSE_PAIR_E2E}"
